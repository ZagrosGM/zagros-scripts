name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: shellcheck + syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck 0.10.0 (pinned)
        run: |
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz \
            | sudo tar -xJ -C /usr/local/bin --strip-components=1 shellcheck-v0.10.0/shellcheck
          shellcheck --version

      - name: bash -n
        run: bash -n zagros zagros-host-agent zagros.sh

      - name: shellcheck
        run: shellcheck -x -S warning zagros zagros-host-agent zagros.sh

  cli-tests:
    name: CLI end-to-end logic (docker-emulated harness)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the test harness from zagros-devkit
        id: devkit
        env:
          DEVKIT_TOKEN: ${{ secrets.DEVKIT_TOKEN }}
        run: |
          if [ -z "$DEVKIT_TOKEN" ]; then
            echo "DEVKIT_TOKEN is not set — the harness lives in the private"
            echo "zagros-devkit repository, so these checks are skipped."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${DEVKIT_TOKEN}@github.com/ZagrosGM/zagros-devkit.git" \
            /tmp/devkit
          cp -a /tmp/devkit/zagros-scripts/tests ./tests
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Install pinned shellcheck-independent deps
        run: |
          command -v jq curl openssl tar python3
          python3 --version

      - name: Run the full CLI harness
        if: steps.devkit.outputs.available == 'true'
        run: bash tests/test_cli.sh

      - name: Upload harness logs on failure
        if: failure() && steps.devkit.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cli-test-logs
          path: /tmp/zagros-cli-tests.*/logs/
          if-no-files-found: ignore
