name: E2E (real VPS)

# The honesty gate: a fresh machine, real Docker, the real GHCR image and the
# real installer — no doubles. Trigger manually (workflow_dispatch) or on a
# schedule; results appear in the Actions tab.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "image tag to install (empty = newest GitHub release)"
        required: false
        default: ""
      database:
        description: "sqlite | mysql | mariadb | postgresql"
        required: false
        default: "sqlite"
  schedule:
    - cron: "17 3 * * *"   # nightly, UTC

env:
  IMAGE: ghcr.io/zagrosgm/zagros

jobs:
  real-install:
    name: install → admin → cores → backup/restore → uninstall (${{ github.event.inputs.database || 'sqlite' }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the CLI from this checkout (what zagros.sh would fetch)
        run: |
          sudo install -m 0755 zagros /usr/local/bin/zagros
          zagros version

      - name: zagros install
        run: |
          set -e
          args=(install)
          db="${{ github.event.inputs.database }}"
          [[ -n "$db" && "$db" != "sqlite" ]] && args+=(--database "$db")
          tag="${{ github.event.inputs.version }}"
          [[ -n "$tag" ]] && args+=(--version "$tag")
          sudo -E ASSUME_YES=1 zagros "${args[@]}"

      - name: config contract (.env-only, mount-only, verbatim bind host)
        run: |
          set -e
          # 1) the panel is configured by /opt/zagros/.env — and only by it
          test -f /opt/zagros/.env
          test ! -e /opt/zagros/zagros.env
          grep -q './.env:/code/.env:ro' /opt/zagros/docker-compose.yml
          ! grep -q 'env_file:' /opt/zagros/docker-compose.yml
          # 2) bind host from .env is honored VERBATIM (alpha.4 regression:
          #    used to be silently forced to 127.0.0.1 without TLS)
          test "$(sudo zagros config get UVICORN_HOST)" = "0.0.0.0"
          sudo ss -lntp | grep -q '0.0.0.0:8000'
          curl -fsS "http://127.0.0.1:8000/dashboard/" -o /dev/null -w 'bind check on .0:8000: %{http_code}\n'
          # Panel Network Apply is honest only when the root host watcher is
          # actually active; copied files alone must never create readiness.
          sudo test -x /usr/local/libexec/zagros-host-agent
          sudo systemctl is-active --quiet zagros-host-agent.path
          sudo test -f /var/lib/zagros/host-actions/.agent-ready

      - name: first sudo admin + probes
        run: |
          # fixed throwaway password — the runner is ephemeral and wiped at the end
          sudo zagros create-admin --username e2e-admin --password 'E2e-Test-Pass-1' --sudo
          sudo zagros status
          sudo zagros health
          sudo zagros config validate
          sudo zagros doctor
          curl -fsS "http://127.0.0.1:$(sudo zagros config get UVICORN_PORT)/dashboard/" -o /dev/null -w 'ops UI GET: %{http_code}\n'

      - name: edit .env → restart applies it (port roundtrip 8000 → 8080 → 8000)
        run: |
          set -e
          sudo zagros config set UVICORN_PORT 8080 --restart
          test "$(sudo zagros config get UVICORN_PORT)" = "8080"
          sudo ss -lntp | grep -q '0.0.0.0:8080'
          curl -fsS "http://127.0.0.1:8080/dashboard/" -o /dev/null -w 'dashboard on 8080: %{http_code}\n'
          sudo zagros config set UVICORN_PORT 8000 --restart
          sudo ss -lntp | grep -q '0.0.0.0:8000'
          curl -fsS "http://127.0.0.1:8000/dashboard/" -o /dev/null -w 'dashboard back on 8000: %{http_code}\n'
          sudo zagros config reload
          sudo zagros config show | grep -q '^UVICORN_PORT=8000'

      - name: install cores (sing-box AND xray — real upstream binaries)
        run: |
          sudo zagros install-core sing-box
          sudo zagros install-core xray || true   # xray binary may be arch-restricted; log, don't fail the matrix here
          sudo zagros list-cores
          sudo zagros sync

      - name: login + create user (real API, checklist #3-4)
        run: |
          set -e
          TOKEN=$(curl -fsS -X POST "http://127.0.0.1:8000/api/admin/token" \
            -d 'username=e2e-admin' --data-urlencode 'password=E2e-Test-Pass-1' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl -fsS -H "Authorization: Bearer $TOKEN" "http://127.0.0.1:8000/api/system" -o /dev/null -w 'system API: %{http_code}\n'
          # fresh install enables only the default shadowsocks inbound; asking
          # for a protocol with no inbound is a REAL 400 (verified: "Protocol
          # ProxyTypes.VLESS is disabled on your server")
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"username":"e2e-user","proxies":{"shadowsocks":{}},"inbounds":{},"data_limit":1073741824}' \
            "http://127.0.0.1:8000/api/user" -o /dev/null -w 'create user: %{http_code}\n'
          curl -fsS -H "Authorization: Bearer $TOKEN" "http://127.0.0.1:8000/api/users?limit=10" \
            | grep -q 'e2e-user' && echo "user persists ✓" 

      - name: dashboard refresh storm + 5-minute stability watch (checklist #7-10)
        run: |
          set -e
          for i in $(seq 1 10); do
            curl -fsS "http://127.0.0.1:8000/dashboard/" -o /dev/null -w "watch $i/10 dashboard: %{http_code}\n"
            curl -fsS "http://127.0.0.1:8000/dashboard/zagros.svg" -o /dev/null || true
            idx=$(curl -fsS "http://127.0.0.1:8000/dashboard/")
            for asset in $(echo "$idx" | grep -oE '/statics/[a-zA-Z0-9._-]+\.(js|css)' | sort -u | head -4); do
              curl -fsS "http://127.0.0.1:8000$asset" -o /dev/null || { echo "asset failed: $asset"; exit 1; }
            done
            [ "$i" -lt 10 ] && sleep 30 || true
          done
          echo "5-minute watch done — dashboard stayed 200, assets stable"

      - name: backup → mutate → restore (checklist #11-12)
        run: |
          set -e
          # marker lands in the data tarball; then mutate live state
          echo e2e-marker | sudo tee /var/lib/zagros/.e2e-marker >/dev/null
          sudo zagros backup
          sudo rm -f /var/lib/zagros/.e2e-marker
          sudo sed -i 's/^UVICORN_PORT=.*/UVICORN_PORT=9999/' /opt/zagros/.env
          sudo zagros restore latest --yes
          test -f /var/lib/zagros/.e2e-marker
          test "$(sudo zagros config get UVICORN_PORT)" = "8000"
          sudo zagros health

      - name: update (re-run — should be a healthy no-op or roll forward)
        run: |
          sudo -E ASSUME_YES=1 zagros update -y || sudo zagros rollback --yes
          sudo zagros status

      - name: browser smoke — REAL Chromium gates the SPA (alpha.5 white-screen regression)
        run: |
          set -e
          cd tests
          npm init -y >/dev/null 2>&1 || true
          npm i playwright@1.45.0 --no-audit --no-fund
          npx playwright install --with-deps chromium
          # spec: the panel must survive AT LEAST 5 minutes — soak is 300 s
          PANEL_URL="http://127.0.0.1:8000/dashboard/" \
          PANEL_USER=e2e-admin PANEL_PASS='E2e-Test-Pass-1' SOAK_SECS=300 \
            node browser-smoke.mjs

      - name: logs tail for diagnosis
        run: sudo zagros logs --tail 30 --no-follow

      - name: FULL uninstall (checklist #13) — --purge must NOT exist anymore
        run: |
          set -e
          if sudo zagros uninstall --purge --yes > /tmp/purge.out 2>&1; then
            echo 'FATAL: --purge was accepted — it must not exist anymore'; exit 1
          fi
          grep -q 'no such option' /tmp/purge.out
          sudo zagros uninstall --yes | tee /tmp/uninstall.out
          grep -q 'containers:' /tmp/uninstall.out
          grep -q 'databases' /tmp/uninstall.out

      - name: verify the system is spotless (checklist #14)
        run: |
          set -e
          echo "--- docker ps -a";           docker ps -a
          echo "--- docker images";           docker images
          echo "--- docker volume ls";        docker volume ls
          echo "--- docker network ls";       docker network ls
          echo "--- systemd units";           systemctl list-unit-files | grep -i zagros || echo "no zagros units"
          echo "--- crontab";                 sudo crontab -l 2>/dev/null | grep -i zagros || echo "no zagros cron"
          ! docker ps -a --format '{{.Names}}' | grep -q '^zagros'
          ! docker images --format '{{.Repository}}' | grep -qE '^(ghcr\.io/zagrosgm/zagros|mysql|mariadb|postgres)$'
          ! docker volume ls --format '{{.Name}}' | grep -q '^zagros'
          ! docker network ls --format '{{.Name}}' | grep -q '^zagros'
          test ! -e /opt/zagros
          test ! -e /var/lib/zagros
          test ! -e /etc/zagros
          test ! -e /usr/local/bin/zagros
          test ! -e /usr/local/libexec/zagros-host-agent
          echo "CLEAN: system looks like Zagros was never installed ✓"

      - name: reinstall — fresh install must work with zero leftovers (checklist #15-16)
        run: |
          set -e
          sudo install -m 0755 zagros /usr/local/bin/zagros
          args=(install)
          db="${{ github.event.inputs.database }}"
          [[ -n "$db" && "$db" != "sqlite" ]] && args+=(--database "$db")
          tag="${{ github.event.inputs.version }}"
          [[ -n "$tag" ]] && args+=(--version "$tag")
          sudo -E ASSUME_YES=1 zagros "${args[@]}"
          sleep 20
          curl -fsS --retry 10 --retry-delay 5 --retry-connrefused \
            "http://127.0.0.1:8000/dashboard/" -o /dev/null -w 'post-reinstall dashboard: %{http_code}\n'
          sudo zagros health

      - name: final cleanup uninstall
        if: always()
        run: sudo zagros uninstall --yes || true
